<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS Chat</title>
<style>
  :root { color-scheme: dark; --bg: #14161a; --fg: #e6e6e6; --muted: #8b929c; --line: #2a2d33; --field: #1c1f24; --field-line: #2f343b; --bubble: #22262c; --dash: #3a3f47; --empty: #6b7280; --err-bg: #3a1e1e; --err-fg: #ff9b9b; }
  :root[data-theme=light] { color-scheme: light; --bg: #fff; --fg: #14161a; --muted: #5b6470; --line: #e3e6ea; --field: #f6f7f9; --field-line: #d8dce2; --bubble: #f1f3f6; --dash: #d8dce2; --empty: #9aa2ac; --err-bg: #fdecec; --err-fg: #b42323; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; align-items: center; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { align-self: stretch; padding: 10px 16px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  header b { color: var(--fg); font-size: 14px; }
  header .spacer { flex: 1; }
  textarea, button { font: inherit; color: inherit; background: var(--field); border: 1px solid var(--field-line); border-radius: 8px; }
  label.toggle { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #2b5bd7; }
  #log { flex: 1; width: 100%; max-width: 812px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 780px; width: fit-content; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 auto; }
  .user { background: #2b5bd7; color: #fff; margin: 0 0 0 auto; }
  .assistant { background: var(--bubble); width: 100%; margin: 0 auto; }
  .msg details { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed var(--dash); }
  .msg summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .reasoning { color: #98a0aa; font-size: 14px; white-space: pre-wrap; margin-top: 6px; }
  .assistant > div:empty { display: none; }
  .pending { display: flex; gap: 4px; padding: 4px 0; }
  .pending i { width: 6px; height: 6px; border-radius: 50%; background: #8b929c; animation: blink 1.2s infinite; }
  .pending i:nth-child(2) { animation-delay: .2s; }
  .pending i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .err { background: var(--err-bg); color: var(--err-fg); }
  .empty { margin: auto; color: var(--empty); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); max-width: 812px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 10px 12px; max-height: 40dvh; }
  button { padding: 0 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #attach { padding: 0 12px; }
  #files { display: none; gap: 6px; flex-wrap: wrap; padding: 0 16px 8px; max-width: 812px; width: 100%; margin: 0 auto; }
  #files:not(:empty) { display: flex; }
  .chip { display: flex; gap: 6px; align-items: center; padding: 4px 8px; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; font-size: 13px; }
  .chip button { padding: 0 4px; border: none; background: none; color: var(--muted); }
  .msg .attach { display: block; margin-top: 6px; font-size: 12px; opacity: .75; }
  .preview { width: 100%; min-width: 320px; height: 320px; border: 1px solid var(--field-line); border-radius: 8px; background: #fff; resize: vertical; overflow: auto; }
  .assistant pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 240px; overflow: auto; }
  .html-block summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .html-block .save { padding: 0 8px; font-size: 12px; }
</style>
</head>
<body>
<header><b>DS Chat</b><label class="toggle"><input type="checkbox" id="thinking">thinking</label><span class="spacer"></span><label class="toggle" title="Toggle theme"><input type="checkbox" id="theme">dark</label></header>
<div id="log"></div>
<div id="files"></div>
<form id="form"><input type="file" id="file" multiple hidden><button type="button" id="attach" title="Attach file">📎</button><textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea><button id="send">Send</button></form>
<script>
'use strict';
const sessionId = crypto.randomUUID();
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const thinking = document.getElementById('thinking');
const theme = document.getElementById('theme');
const attach = document.getElementById('attach');
const fileInput = document.getElementById('file');
const fileList = document.getElementById('files');
const history = [];
const MAX_FILE_BYTES = 25 * 1024 * 1024;
let pending = [];

function renderFiles() {
  fileList.replaceChildren(...pending.map((f, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    const name = document.createElement('span');
    name.textContent = f.name;
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '✕';
    remove.onclick = () => { pending.splice(i, 1); renderFiles(); };
    chip.append(name, remove);
    return chip;
  }));
}

function readAsDataUri(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

attach.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  for (const file of fileInput.files) {
    if (file.size > MAX_FILE_BYTES) { bubble('err', `File "${file.name}" exceeds 25 MB`); continue; }
    pending.push(file);
  }
  fileInput.value = '';
  renderFiles();
});

function bubble(role, text) {
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function assistantBubble() {
  const el = bubble('assistant', '');
  const details = document.createElement('details');
  details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = 'thinking';
  const reason = document.createElement('div');
  reason.className = 'reasoning';
  details.append(summary, reason);
  const answer = document.createElement('div');
  el.append(details, answer);
  return { el, details, reason, answer };
}

function renderAnswer(el, text) {
  const parts = [];
  const re = /```html[ \t]*\r?\n([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ kind: 'text', value: text.slice(last, m.index) });
    parts.push({ kind: 'html', value: m[1] });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ kind: 'text', value: text.slice(last) });
  el.replaceChildren(...parts.map((p) => {
    if (p.kind === 'text') {
      const div = document.createElement('div');
      div.textContent = p.value.trim();
      return div;
    }
    const wrap = document.createElement('div');
    wrap.className = 'html-block';
    const frame = document.createElement('iframe');
    frame.className = 'preview';
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.srcdoc = p.value;
    const code = document.createElement('details');
    const summary = document.createElement('summary');
    const label = document.createElement('span');
    label.textContent = 'html source';
    const save = document.createElement('button');
    save.type = 'button';
    save.className = 'save';
    save.textContent = 'save';
    save.onclick = (e) => {
      e.preventDefault();
      const url = URL.createObjectURL(new Blob([p.value], { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'page.html';
      a.click();
      URL.revokeObjectURL(url);
    };
    summary.append(label, save);
    const pre = document.createElement('pre');
    pre.textContent = p.value;
    code.append(summary, pre);
    wrap.append(frame, code);
    return wrap;
  }));
}

function reset() {
  history.length = 0;
  log.replaceChildren();
  bubble('empty', 'History is kept in memory only. Reloading the page starts a new chat.');
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

let controller = null;

send.addEventListener('click', (e) => {
  if (!controller) return;
  e.preventDefault();
  controller.abort();
});

function busy(on) {
  send.textContent = on ? 'Stop' : 'Send';
  send.disabled = false;
  input.disabled = on;
  attach.disabled = on;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if ((!text && pending.length === 0) || controller) return;
  input.value = '';
  input.style.height = 'auto';
  const attached = pending;
  pending = [];
  renderFiles();
  let content = text;
  if (attached.length > 0) {
    content = [];
    if (text) content.push({ type: 'text', text });
    try {
      for (const file of attached) {
        content.push({ type: 'image_url', image_url: { url: await readAsDataUri(file), detail: file.name } });
      }
    } catch (err) {
      pending = attached;
      renderFiles();
      bubble('err', 'File read error: ' + err.message);
      return;
    }
  }
  history.push({ role: 'user', content });
  const shown = bubble('user', text || '');
  if (attached.length > 0) {
    const note = document.createElement('span');
    note.className = 'attach';
    note.textContent = '📎 ' + attached.map(f => f.name).join(', ');
    shown.append(note);
  }
  const out = assistantBubble();
  const pendingDots = document.createElement('div');
  pendingDots.className = 'pending';
  pendingDots.innerHTML = '<i></i><i></i><i></i>';
  out.answer.append(pendingDots);
  controller = new AbortController();
  busy(true);
  let answer = '';
  let reasonText = '';
  let dirty = false;
  const flush = () => {
    if (!dirty) return;
    dirty = false;
    if (reasonText) out.reason.textContent = reasonText;
    if (answer) out.answer.textContent = answer;
    log.scrollTop = log.scrollHeight;
  };
  const schedule = () => {
    if (dirty) return;
    dirty = true;
    requestAnimationFrame(flush);
  };
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json', 'x-session-id': sessionId },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: history,
        stream: true,
        thinking: { type: thinking.checked ? 'enabled' : 'disabled' },
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data?.error?.message || ('HTTP ' + res.status));
    }
    let buf = '';
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!frame.startsWith('data:')) continue;
        const payload = frame.slice(5).trim();
        if (payload === '[DONE]') continue;
        let chunk;
        try { chunk = JSON.parse(payload); } catch (e) { continue; }
        const delta = chunk.choices?.[0]?.delta || {};
        if (delta.content) pendingDots.remove();
        if (delta.reasoning_content) {
          out.details.hidden = false;
          out.details.open = true;
          reasonText += delta.reasoning_content;
        }
        if (delta.content) answer += delta.content;
        schedule();
      }
    }
    answer = answer.trim() || '(empty response)';
    dirty = false;
    renderAnswer(out.answer, answer);
    pendingDots.remove();
    if (!out.reason.textContent) out.details.remove(); else out.details.open = true;
    history.push({ role: 'assistant', content: answer });
  } catch (err) {
    if (err.name === 'AbortError') {
      pendingDots.remove();
      if (answer.trim()) {
        renderAnswer(out.answer, answer.trim());
        history.push({ role: 'assistant', content: answer.trim() });
      } else {
        history.pop();
        out.el.remove();
      }
    } else {
      history.pop();
      out.el.remove();
      bubble('err', 'Error: ' + err.message);
    }
  } finally {
    controller = null;
    busy(false);
    log.scrollTop = log.scrollHeight;
    input.focus();
  }
});

const THEME_KEY = 'ds-chat-theme';
function applyTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  theme.checked = dark;
  localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
}
theme.addEventListener('change', () => applyTheme(theme.checked));
applyTheme(localStorage.getItem(THEME_KEY) === 'dark');

const THINKING_KEY = 'ds-chat-thinking';
thinking.checked = localStorage.getItem(THINKING_KEY) === 'on';
thinking.addEventListener('change', () => localStorage.setItem(THINKING_KEY, thinking.checked ? 'on' : 'off'));

window.addEventListener('pageshow', (e) => { if (e.persisted) reset(); });
reset();
</script>
</body>
</html>

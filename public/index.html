<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS Chat</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; font: 15px/1.5 system-ui, sans-serif; background: #14161a; color: #e6e6e6; }
  header { padding: 10px 16px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #2a2d33; font-size: 13px; color: #8b929c; }
  header b { color: #e6e6e6; font-size: 14px; }
  textarea, button { font: inherit; color: inherit; background: #1c1f24; border: 1px solid #2f343b; border-radius: 8px; }
  label.toggle { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #2b5bd7; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 780px; width: fit-content; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: #2b5bd7; color: #fff; }
  .assistant { align-self: flex-start; background: #22262c; }
  .msg details { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #3a3f47; }
  .msg summary { cursor: pointer; color: #8b929c; font-size: 13px; }
  .reasoning { color: #98a0aa; font-size: 14px; white-space: pre-wrap; margin-top: 6px; }
  .assistant > div:empty { display: none; }
  .err { align-self: flex-start; background: #3a1e1e; color: #ff9b9b; }
  .empty { margin: auto; color: #6b7280; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #2a2d33; }
  textarea { flex: 1; resize: none; padding: 10px 12px; max-height: 40dvh; }
  button { padding: 0 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><b>DS Chat</b><label class="toggle"><input type="checkbox" id="thinking">thinking</label></header>
<div id="log"></div>
<form id="form"><textarea id="input" rows="1" placeholder="Сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea><button id="send">Отправить</button></form>
<script>
'use strict';
const sessionId = crypto.randomUUID();
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const thinking = document.getElementById('thinking');
const history = [];

function bubble(role, text) {
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function assistantBubble() {
  const el = bubble('assistant', '');
  const details = document.createElement('details');
  details.hidden = true;
  const summary = document.createElement('summary');
  summary.textContent = 'reasoning…';
  const reason = document.createElement('div');
  reason.className = 'reasoning';
  details.append(summary, reason);
  const answer = document.createElement('div');
  el.append(details, answer);
  return { el, details, reason, answer };
}

function reset() {
  history.length = 0;
  log.replaceChildren();
  bubble('empty', 'История хранится только в памяти. Перезагрузка страницы — новый чат.');
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = '';
  input.style.height = 'auto';
  history.push({ role: 'user', content: text });
  bubble('user', text);
  const out = assistantBubble();
  send.disabled = true;
  let answer = '';
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-id': sessionId },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: history,
        stream: true,
        thinking: { type: thinking.checked ? 'enabled' : 'disabled' },
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data?.error?.message || ('HTTP ' + res.status));
    }
    let buf = '';
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!frame.startsWith('data:')) continue;
        const payload = frame.slice(5).trim();
        if (payload === '[DONE]') continue;
        let chunk;
        try { chunk = JSON.parse(payload); } catch (e) { continue; }
        const delta = chunk.choices?.[0]?.delta || {};
        if (delta.reasoning_content) {
          out.details.hidden = false;
          out.reason.textContent += delta.reasoning_content;
        }
        if (delta.content) {
          answer += delta.content;
          out.answer.textContent = answer;
        }
        log.scrollTop = log.scrollHeight;
      }
    }
    answer = answer.trim() || '(пустой ответ)';
    out.answer.textContent = answer;
    if (out.details.hidden) out.details.remove(); else out.details.open = false;
    history.push({ role: 'assistant', content: answer });
  } catch (err) {
    out.el.remove();
    bubble('err', 'Ошибка: ' + err.message);
  } finally {
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }
});

window.addEventListener('pageshow', (e) => { if (e.persisted) reset(); });
reset();
</script>
</body>
</html>
